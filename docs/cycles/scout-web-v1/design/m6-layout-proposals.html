  <template id="sc-m6-editor">
    <div class="sc-column sc-context">
      <section class="sc-panel"><div class="sc-panel-head"><h2>Position information</h2></div><label>Company (required)<select><option>Nordlicht Systems GmbH</option></select></label><label>Position title (required)<input data-position-title value="Senior Software Engineer" required maxlength="200"></label><label>Opportunity status<select><option>Active</option><option>Paused</option><option>Closed</option></select></label><div class="sc-pair"><label>Discovery date<input type="date" value="2026-10-09"></label><label>Closing date<input type="date"></label></div><label>Original vacancy URL<input type="url" value="https://nordlicht.example/careers/platform"></label><div class="sc-pair"><label>Location<input value="Berlin / remote"></label><label>Employment type<input value="Full time"></label></div></section>
    </div>
    <div class="sc-column sc-work">
      <section class="sc-panel"><div class="sc-panel-head"><h2>Original vacancy description</h2><span class="sc-tag">Preserved source</span></div><div class="sc-read"><h3>Build a reliable platform for product teams</h3><p>We are looking for an engineer who combines hands-on delivery with pragmatic architecture and clear communication.</p><p>You will work with product teams on resilient services, developer experience and a gradual platform migration.</p><h3>Responsibilities</h3><ul><li>Design and operate services with clear ownership.</li><li>Make technical choices collaboratively.</li><li>Support colleagues through reviews and mentoring.</li></ul><h3>Working together</h3><p>The team collaborates remotely with regular sessions in Berlin. The interview will explore practical experience and how you approach trade-offs.</p></div><p class="sc-field-note">Preserved as originally saved. Put corrections in personal notes.</p></section>
    </div>
    <div class="sc-column sc-support">
      <section class="sc-panel"><div class="sc-panel-head"><h2>Your notes</h2><button class="sc-icon" aria-label="Preview note formatting" data-tooltip="Preview formatting" data-command="preview"><i data-lucide="eye" aria-hidden="true"></i></button></div><label>Remote-work notes<textarea>Clarify expected office attendance and whether location affects the role.</textarea></label><label>Personal notes<textarea>Interesting platform ownership scope.

Ask how product teams contribute to architecture decisions.</textarea></label><p class="sc-field-note">Save explicitly. The preserved vacancy text remains unchanged.</p></section>
    </div>
  </template>
  <dialog aria-labelledby="sc-m6-dialog-title" aria-describedby="sc-m6-dialog-description"><h2 id="sc-m6-dialog-title"></h2><div id="sc-m6-dialog-description"></div><footer></footer></dialog>
  <script>
  (() => {
    const root = document.getElementById('scout-m6-review');
    const designs = [...root.querySelectorAll('[data-variant]')];
    const modal = root.querySelector('dialog');
    const title = root.querySelector('#sc-m6-dialog-title');
    const description = root.querySelector('#sc-m6-dialog-description');
    const footer = modal.querySelector('footer');
    const config = { state:'Populated', gaps:24, failure:false };
    let screen = 'application', dirty = false, lastFocus = null, draft = null, modalDirty = false;
    const role = 'Senior Software Engineer';
    const longRole = 'Senior Software Engineer — Platform Architecture, Developer Experience and Cross-Team Technical Leadership';
    const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
    const action = (label, command, primary=false, name='') => `<button type="button" class="${primary?'sc-primary':''}" data-command="${command}">${name?icon(name):''}${label}</button>`;
    const demo = (label,name='') => `<button type="button" data-demo="${label}">${name?icon(name):''}${label}</button>`;
    const titles = {application:'Senior Software Engineer',preparation:'Prepare: Technical conversation',editor:'Edit position'};
    function hydrateIcons() { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:18,height:18}}); }
    function chrome() {
      const nav = ['Companies','Positions','Applications','Next actions','Documents','CVs','Employer questions','STAR experiences'];
      const current = screen === 'editor' ? 'Positions' : 'Applications';
      return `<header class="sc-nav"><div class="sc-brand"><span class="sc-mark">S</span>Scout</div><nav aria-label="Main navigation">${nav.map(n=>`<a href="#" data-demo="${n} catalog" ${n===current?'aria-current="page"':''}>${n}</a>`).join('')}</nav><span class="sc-local">Personal · Local</span></header>`;
    }
    function breadcrumbs() {
      return `<nav class="sc-crumb" aria-label="Breadcrumb"><a href="#" data-demo="Companies catalog">Companies</a><span aria-hidden="true">›</span><a href="#" data-demo="Company details">Nordlicht Systems GmbH</a><span aria-hidden="true">›</span><a href="#" data-demo="Position details" data-role-name>${role}</a>${screen==='editor'?'<span aria-hidden="true">›</span><span aria-current="page">Edit</span>':`<span aria-hidden="true">›</span><a href="#" data-command="application">Autumn 2026</a>${screen==='preparation'?'<span aria-hidden="true">›</span><span aria-current="page">Technical conversation · Preparation</span>':''}`}</nav>`;
    }
    function actions() {
      const more = `<details><summary>More ${icon('chevron-down')}</summary><div class="sc-menu">${action('Archive '+(screen==='editor'?'position':'application'),'archive')}${demo('Record details')}</div></details>`;
      if(screen==='editor') return `${action('Save position','save',true,'check')}${action('Cancel','cancel')}<span class="sc-spacer"></span><span class="sc-muted" data-dirty-status>All changes saved</span>`;
      if(screen==='preparation') return `${action('Review & open Workspace','workspace',true,'panels-top-left')}${action('Interview details','interview')}${action('Add questions','questions',false,'plus')}${action('Add experiences','experiences',false,'plus')}<span class="sc-spacer"></span><span class="sc-muted">Private preparation</span>`;
      return `${action('Edit application','edit-application',true,'pencil')}${demo('Add interview','plus')}${demo('Add next action','plus')}${demo('Open position','external-link')}<span class="sc-spacer"></span>${more}`;
    }
    function render() {
      designs.forEach(design => {
        const w = design.querySelector('.sc-window');
        w.innerHTML = chrome()+`<main class="sc-body"><a class="sc-before-back" href="#" data-demo="Back to ${screen==='editor'?'position':'applications'}">← ${screen==='editor'?'Position details':'Applications'}</a>${breadcrumbs()}<div class="sc-heading"><div><p class="sc-kicker">${screen==='editor'?'Opportunity details':screen==='preparation'?'Interview preparation · Private':'Application · Autumn 2026'}</p><h1 ${screen==='application'?'data-role-name':''}>${titles[screen]}</h1><p class="sc-muted">${screen==='editor'?'Nordlicht Systems GmbH · Only company and title are required.':screen==='preparation'?'Nordlicht Systems GmbH · 20 October 2026 · 10:00':'Nordlicht Systems GmbH · Applied 12 October 2026'}</p></div><span class="sc-tag">${screen==='editor'?'Editing':screen==='preparation'?'Scheduled':'Interviewing'}</span></div><div class="sc-actions" aria-label="${screen} actions">${actions()}</div><div class="sc-columns"></div><div class="sc-bottom">${screen==='editor'?'Original source preserved · Manual saving':screen==='preparation'?'Prepared question wording is a copy · STAR source stays linked · Sharing requires separate approval':'Local records · Original documents and submission history preserved'}</div></main>`;
        const content = root.querySelector('#sc-m6-'+screen).content.cloneNode(true);
        w.querySelector('.sc-columns').append(content);
        if(screen==='editor' && draft) w.querySelectorAll('input,textarea,select').forEach((e,i)=>{if(i<draft.length)e.value=draft[i];});
      });
      applyState(); updateDirty(); hydrateIcons();
      root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===screen)));
    }
    function applyState() {
      root.querySelectorAll('.sc-rich').forEach(e=>e.hidden=config.state==='Sparse');
      root.querySelectorAll('[data-empty]').forEach(e=>e.hidden=config.state!=='Sparse');
      root.querySelectorAll('[data-role-name]').forEach(e=>e.textContent=config.state==='Long names'?longRole:role);
      designs.forEach(d=>{d.querySelector('.sc-columns').style.gap=config.gaps+'px';});
    }
    function remember() {
      if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{screen,state:config.state},privateContent:{}}).catch(()=>{});
    }
    function updateDirty() { root.querySelectorAll('[data-dirty-status]').forEach(e=>e.textContent=dirty?'Unsaved changes':'All changes saved'); }
    function close(force=false) {
      if(modalDirty&&!force) {
        const oldHeading=title.textContent, oldBody=[...description.childNodes], oldButtons=[...footer.childNodes];
        dialog('Discard these changes?','<p>The changes in this dialog have not been saved.</p>',[{label:'Keep editing',primary:true,run:()=>{title.textContent=oldHeading;description.replaceChildren(...oldBody);footer.replaceChildren(...oldButtons);modalDirty=true;description.querySelector('input,textarea,select')?.focus();}},{label:'Discard changes',run:()=>close(true)}]);
        return;
      }
      modalDirty=false;if(modal.open)modal.close(); lastFocus?.focus();
    }
    function dialog(heading,content,buttons) {
      if(modal.open)modal.close();else lastFocus=document.activeElement;
      modalDirty=false;title.textContent=heading; description.innerHTML=content; footer.replaceChildren();
      buttons.forEach(spec=>{const b=document.createElement('button');b.type='button';b.textContent=spec.label;b.className=spec.primary?'sc-primary':'';b.addEventListener('click',()=>spec.run());footer.append(b);});
      modal.showModal(); hydrateIcons();
    }
    function acknowledge(heading,content) { dialog(heading,content,[{label:'Done',primary:true,run:close}]); }
    function saveOutcome(heading,onSuccess) {
      if(config.failure) {
        if(modal.open&&description.querySelector('input,textarea,select')) {
          let error=description.querySelector('.sc-dialog-error');if(!error){error=document.createElement('p');error.className='sc-dialog-error';error.setAttribute('role','alert');description.prepend(error);}
          error.textContent='Save could not be confirmed. Your inputs are retained. Check the saved record before starting another attempt.';
        } else dialog('Save could not be confirmed','<p class="sc-dialog-error">Your draft is retained. Check the saved record before starting a new attempt.</p><p>Prototype failure state; no data was written.</p>',[{label:'Keep editing',primary:true,run:close}]);
        return;
      }
      modalDirty=false;onSuccess?.(); acknowledge(heading,'<p>Prototype of the confirmed-success dialog. No application data was written.</p>');
    }
    function changeScreen(next) {
      const go=()=>{close();screen=next;dirty=false;draft=null;render();remember();};
      if(dirty) dialog('Leave without saving?','<p>Your position changes have not been saved.</p>',[{label:'Keep editing',primary:true,run:close},{label:'Leave without saving',run:go}]); else go();
    }
    function picker(heading,items,label) {
      dialog(heading,items.map((item,i)=>`<label class="sc-check"><input type="checkbox" ${i===0?'checked':''}>${item}</label>`).join(''),[{label:'Cancel',run:close},{label,primary:true,run:()=>saveOutcome(label+' — saved')}]);
    }
    function run(command,source) {
      if(command==='application'||command==='prepare'){changeScreen(command==='prepare'?'preparation':'application');return;}
      if(command==='contacts'){picker('Manage application contacts',['Mara Beispiel · Engineering lead','Alex Muster · Recruiter'],'Save contacts');return;}
      if(command==='questions'){picker('Add employer questions',['How does the team make architecture decisions?','What would success look like after three months?'],'Add selected questions');return;}
      if(command==='experiences'){picker('Add STAR experiences',['Aligning teams on a platform migration','Improving reliability without blocking delivery'],'Add selected experiences');return;}
      if(command==='attach'){picker('Attach existing document',['interview-notes.md','vacancy-original.pdf'],'Attach selected document');return;}
      if(command==='new-contact'){
        dialog('Add company contact','<label>Name (required)<input data-contact-name placeholder="Full name" required></label><label>Role<input placeholder="Role or relationship"></label><div class="sc-pair"><label>Email<input type="email" placeholder="name@company.example"></label><label>Phone<input type="tel"></label></div><label>Profile URL<input type="url"></label><label>Notes<textarea></textarea></label><p class="sc-field-note">Company: Nordlicht Systems GmbH. Creating a company contact does not silently change explicit application selections.</p>',[{label:'Cancel',run:close},{label:'Save contact',primary:true,run:()=>{if(!description.querySelector('[data-contact-name]').reportValidity())return;saveOutcome('Contact saved');}}]);return;
      }
      if(command==='edit-application'){
        dialog('Edit application','<p>Nordlicht Systems GmbH · Senior Software Engineer</p><label>Attempt label<input value="Autumn 2026"></label><label>Status<select><option>Interviewing</option><option>Applied</option></select></label><div class="sc-pair"><label>Applied<input type="date" value="2026-10-12"></label><label>Outcome date<input type="date"></label></div><label>Outcome notes<textarea></textarea></label><label>Application notes<textarea>Explore ownership of the platform.</textarea></label>',[{label:'Cancel',run:close},{label:'Save application',primary:true,run:()=>saveOutcome('Application saved')}]);return;
      }
      if(command==='unlink'||command==='archive'||command==='remove-question') {
        const unlink=command==='unlink', remove=command==='remove-question';
        dialog(unlink?'Unlink interview-notes.md?':remove?'Remove this question from preparation?':'Archive this application?',`<p>${unlink?'Only this application link will be removed. The original file and other associations remain.':remove?'The question remains in the catalog. This interview selection and its history are preserved.':'The application leaves the active list. Its interviews, files and history are preserved; it can be restored.'}</p>`,[{label:'Cancel',primary:true,run:close},{label:unlink?'Remove link':remove?'Remove selection':'Archive application',run:()=>saveOutcome(unlink?'Link removed':remove?'Selection removed':'Application archived',()=>{if(unlink)source.closest('[data-document-row]').hidden=true;if(remove)source.closest('[data-question-item]').hidden=true;})}]);return;
      }
      if(command==='save') {
        const position=source.closest('.sc-window').querySelector('[data-position-title]');
        if(!position.reportValidity())return;
        saveOutcome('Position saved',()=>{dirty=false;updateDirty();});return;
      }
      if(command==='cancel'){changeScreen('application');return;}
      if(command==='workspace'){acknowledge('Private Workspace review','<p>The live workflow first reviews and explicitly approves selected fields. This proposal does not open a shared Workspace or bypass approval.</p>');return;}
      if(command==='edit-question'||command==='rehearsal'){
        dialog(command==='rehearsal'?'Edit private rehearsal notes':'Edit prepared wording / answer',command==='rehearsal'?'<label>Rehearsal notes<textarea>Focus on the disagreement and how the decision changed.</textarea></label>':'<label>Prepared question<textarea>How does the team make architecture decisions?</textarea></label><label>Intent<textarea>Understand autonomy and communication.</textarea></label><label>Suggested follow-ups<textarea>Describe a decision changed after feedback.</textarea></label><label>Private preparation notes<textarea></textarea></label><label>Answer for this interview<textarea></textarea></label><p class="sc-field-note">Large edits retain their full-page route in the final design.</p>',[{label:'Cancel',run:close},{label:'Save changes',primary:true,run:()=>saveOutcome('Changes saved')}]);return;
      }
      if(command==='preview') { const text=source.closest('.sc-window').querySelectorAll('textarea')[1].value;dialog('Preview personal notes','<p data-preview-text></p>',[{label:'Close preview',primary:true,run:close}]);description.querySelector('[data-preview-text]').textContent=text;return; }
      if(command==='reorder'){source.closest('[data-question-item]').parentElement.append(source.closest('[data-question-item]'));return;}
      if(command==='complete'){source.disabled=true;source.setAttribute('aria-label','Action completed in prototype');source.closest('.sc-row').querySelector('p').textContent='Completed in this prototype';return;}
      acknowledge('Interview details','<p>This route remains directly available in Scout. The review focuses on layout rather than implementing navigation.</p>');
    }
    root.addEventListener('click',e=>{
      const review=e.target.closest('[data-screen]');if(review){changeScreen(review.dataset.screen);return;}
      const command=e.target.closest('[data-command]');if(command){e.preventDefault();run(command.dataset.command,command);return;}
      const d=e.target.closest('[data-demo]');if(d){e.preventDefault();acknowledge(d.dataset.demo,'<p>Existing action retained in the proposed layout. This review does not navigate, download, send or change application records.</p>');}
    });
    root.addEventListener('input',e=>{
      if(screen==='editor'&&e.target.closest('.sc-window')) {dirty=true;draft=[...e.target.closest('.sc-window').querySelectorAll('input,textarea,select')].map(i=>i.value);updateDirty();}
    });
    root.addEventListener('change',e=>{if(e.target.matches('[data-show-removed]')){const panel=e.target.closest('.sc-panel');panel.querySelector('.sc-removed').hidden=!e.target.checked;panel.querySelector('.sc-rich').hidden=e.target.checked||config.state==='Sparse';}});
    modal.addEventListener('cancel',e=>{e.preventDefault();close();});
    modal.addEventListener('input',()=>{modalDirty=true;});
    new ResizeObserver(()=>{root.querySelectorAll('.sc-viewport').forEach(e=>e.textContent=Math.round(root.getBoundingClientRect().width)+' CSS px');}).observe(root);
    const saved=window.openai?.widgetState?.modelContent;
    if(saved&&['application','preparation','editor'].includes(saved.screen))screen=saved.screen;
    if(saved&&['Populated','Sparse','Long names'].includes(saved.state))config.state=saved.state;
    render();
    window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.modelContent;if(!dirty&&incoming){if(['application','preparation','editor'].includes(incoming.screen))screen=incoming.screen;if(['Populated','Sparse','Long names'].includes(incoming.state))config.state=incoming.state;render();}});
    if(globalThis.Tweak) { const tweak=new Tweak({container:root,onChange:()=>{applyState();remember();}});tweak.addSelect(config,'state',{label:'Sample content',options:['Populated','Sparse','Long names']});tweak.addSlider(config,'gaps',{label:'Column gap',min:16,max:40,step:4,unit:'px'});tweak.addToggle(config,'failure',{label:'Simulate save failure'}); }
    root.reviewSetState = state => {config.state=state;applyState();};
    root.reviewSetFailure = value => {config.failure=Boolean(value);};
  })();
  </script>
</div>
